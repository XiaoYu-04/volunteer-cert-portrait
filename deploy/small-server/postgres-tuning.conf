# ============================================================================
# postgres-tuning.conf —— 小内存 PostgreSQL 18 参数片段（阿里云 ECS / 1~2 GB）
#
# 这个文件同时装了**两档参数**，用下面的 >>>PROFILE-xxx>>> 标记隔开：
#
#   [1] 自动（推荐）：01-install.sh 读 /proc/meminfo，内存 < 1.5 GB 取 1G 档、
#       >= 1.5 GB 取 2G 档，生成 /etc/postgresql/18/main/conf.d/99-vcp-tuning.conf
#   [2] 手工，取哪档就把下面的 1G 换成 2G（标记行必须是**整行只有标记**，别在它前后加别的字）：
#         sudo install -d /etc/postgresql/18/main/conf.d
#         awk '/^# *>>>PROFILE-1G>>>$/{f=1;next} /^# *<<<PROFILE-1G<<<$/{f=0} f' \
#           postgres-tuning.conf | sudo tee /etc/postgresql/18/main/conf.d/99-vcp-tuning.conf
#   [3] 改完必须**重启**集群才生效（shared_buffers 这类参数 reload 改不动）：
#         sudo systemctl restart postgresql
#       验证：sudo -u postgres psql -c 'SHOW shared_buffers;'
#
# Debian 的 postgresql.conf 默认带 include_dir = 'conf.d'，所以 conf.d/*.conf 会被自动加载，
# 不需要手工去改 postgresql.conf。
#
# ---------------------------------------------------------------------------
# 调参思路（为什么是这几个值）
# ---------------------------------------------------------------------------
# 本库是**演示规模**：1000 学生 / 10 场活动 / 2349 条报名 / 40 张图（二进制约 7 MB），
# 整库不到 100 MB。瓶颈是内存，不是磁盘，所以只动与内存直接相关的项：
#
#   * shared_buffers：PG 自己的缓存池。默认 128MB 对 1 GB 机器其实不算离谱，
#     但演示库全部数据也就几十 MB，192MB 足够把热数据装下；2 GB 机器给 320MB。
#     给太多会把 JVM（-Xmx384m/512m）挤进 swap，反而更慢。
#   * work_mem：**每个排序/哈希节点**各用一份，不是全局值 —— 它是小内存机器上
#     最容易失控的参数，所以显式钉死小值（4~6MB），别依赖默认。
#   * maintenance_work_mem：建索引 / VACUUM 用。演示库脚本里要建十几条索引，
#     给 64/96MB 让 14_performance_indexes.sql 跑得快些。
#   * max_connections：PG 每个连接是一个**进程**（约 5~10 MB 常驻）。
#     应用侧 Hikari 只开 8 条，40 条上限足够再挂 psql / pg_dump / 监控；
#     默认 100 在小机器上纯属浪费内存。
#   * max_parallel_workers_per_gather = 0：**关掉并行查询**。
#     演示库的查询都是毫秒级（14 号脚本实测 0.1~0.9 ms），并行省不来时间，
#     却会让每个查询多起 1~2 个 worker 进程，在小内存上是净损失。
#   * jit = off：PG 的 JIT 对短查询只会白编译、白占内存，演示库完全用不上。
#   * log_min_duration_statement = 1000：只记「慢于 1 秒」的语句。
#     演示规模基本不会触发；一旦触发就是真问题，日志里有据可查。
# ============================================================================

# >>>PROFILE-1G>>>
# ---------- 1 GB 内存档（01-install.sh 自动选中，内存 < 1.5 GB） ----------
max_connections = 40
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
min_wal_size = 80MB
max_wal_size = 512MB
max_parallel_workers_per_gather = 0
jit = off
log_min_duration_statement = 1000
# <<<PROFILE-1G<<<

# >>>PROFILE-2G>>>
# ---------- 2 GB 内存档（01-install.sh 自动选中，内存 >= 1.5 GB） ----------
max_connections = 50
shared_buffers = 320MB
effective_cache_size = 1GB
work_mem = 6MB
maintenance_work_mem = 96MB
wal_buffers = 16MB
min_wal_size = 80MB
max_wal_size = 1GB
max_parallel_workers_per_gather = 0
jit = off
log_min_duration_statement = 1000
# <<<PROFILE-2G<<<
