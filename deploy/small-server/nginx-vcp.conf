# ============================================================================
# nginx-vcp.conf —— 站点配置（Debian 12 自带 nginx 1.22 够用；NGINX_FROM_OFFICIAL=1 时更新）
#
# 安装位置（03-deploy.sh 会自动做）：
#   sudo cp nginx-vcp.conf /etc/nginx/sites-available/vcp
#   sudo ln -sf ../sites-available/vcp /etc/nginx/sites-enabled/vcp
#   sudo rm -f /etc/nginx/sites-enabled/default     # 去掉 Debian 默认站点，避免抢 80 端口
#   sudo nginx -t && sudo systemctl reload nginx
#
# 架构：浏览器 → nginx（80/443）
#                    ├─ /      → /var/www/vcp 下的静态文件（Vue3 构建产物 + 预压缩 .gz）
#                    └─ /api/  → 反代 127.0.0.1:8080（后端无 context-path，路径原样透传）
#
# ⚠️ 本文件**没有** /uploads/ 静态映射，服务器上也**不需要** uploads 目录：
#    活动图片的二进制存在数据库里（attachment.file_data，BYTEA），
#    经 GET /api/v1/attachments/{id}/content 输出 —— 这个路径以 /api/ 开头，
#    自然命中下面的反代；部署时不需要同步任何图片文件。
# ============================================================================

# 与后端保持 32 条空闲长连接：省掉每个请求的 TCP 握手（后端只监听本机，握手很便宜，
# 但长连接顺带省掉了 TIME_WAIT 堆积，高并发下更稳）。
upstream vcp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    # 【部署前必改】有域名就写域名；没有域名（只用公网 IP 访问）就保持 _ 这个通配写法。
    server_name _;

    root  /var/www/vcp;
    index index.html;
    charset utf-8;

    # 活动图片单张上限 5 MB，multipart 请求再留 1 MB 表单开销（对应 application.yml 的
    # spring.servlet.multipart.max-file-size=5MB / max-request-size=6MB）
    client_max_body_size 6m;

    # 隐藏 nginx 版本号
    server_tokens off;

    # ---------- 压缩 ----------
    # gzip_static on：优先发送 deploy/precompress.py 预生成的同名 <文件>.gz
    #（服务器上由 vcp-precompress 生成到 /var/www/vcp），省掉每次请求的运行时压缩；
    #  找不到 .gz 时自动回退到下面 gzip on 的运行时压缩，行为不会坏。
    #  注：若本机 nginx 没编译 http_gzip_static_module，03-deploy.sh 会把这一行注释掉。
    gzip             on;
    gzip_static      on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_comp_level  5;
    gzip_types       text/plain text/css application/javascript application/json
                     image/svg+xml application/xml;

    # ---------- 静态资源 ----------
    location / {
        # SPA 的命门：前端用 history 路由（/student/profile、/admin/categories…），
        # 这些路径在磁盘上不存在，没有这行回退，用户一刷新深层页面就是 404。
        # 最后一个参数是 URI，nginx 会做内部重定向并重新匹配 location，
        # 因此回退出来的 index.html 会命中下面 `location = /index.html`，带上 no-cache。
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须**不缓存**：它是唯一引用「带 hash 文件名」chunk 的文件，
    # 一旦被浏览器缓存，发版后用户会拿旧 index.html 去请求已删除的旧 chunk，页面白屏。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带内容 hash 的产物（Vite 的 assets/xxx-<hash>.js）可以长缓存：
    # 内容变了文件名就变，不存在缓存失效问题。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ---------- 健康检查（给负载均衡/自己用，不写访问日志） ----------
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        # 注意结尾**没有**斜杠：proxy_pass 不带 URI 时路径原样透传，
        # /api/v1/auth/login 到达后端仍是 /api/v1/auth/login（后端没配 context-path）。
        # 若写成 proxy_pass http://vcp_backend/;（带斜杠），/api 前缀会被剥掉，接口全 404。
        proxy_pass http://vcp_backend;

        # keepalive 生效的两个前提：HTTP/1.1 + 清空 Connection 头
        proxy_http_version 1.1;
        proxy_set_header Connection         "";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        # 登录态走 Authorization: Bearer <token>（Sa-Token 配了 is-read-header）。
        # nginx 默认就会透传客户端请求头，这里不写是**故意的**：
        # 写了反而可能被后来的改动覆盖成固定值，把 token 弄丢。
        # 同理，**不要**加 proxy_set_header Cookie ""; 之类多余的头。

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        # 开缓冲：小内存机器上让 nginx 先把后端响应收全再慢慢发给慢客户端，
        # 后端连接能更快归还给 Hikari 池（本机 1 GB 内存下仍很轻）。
        proxy_buffering on;
    }

    # 文档页（/doc.html、/v3/api-docs）**刻意不反代**：prod profile 下它们要登录态，
    # 浏览器直接打开不会带 Authorization 头，反代过去也只会看到 401 JSON；
    # 保持现状则落到 location / 被回退成 index.html。要核收口是否生效，在服务器上直连后端：
    #   curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/doc.html   # 期望 401
}

# ============================================================================
# TLS（443）模板 —— 需要 HTTPS 时取消注释、把【必改】处改成实际值
#
# 说明：
#   * **HTTP/2 只在 TLS 上有意义**（h2c 明文 HTTP/2 浏览器不支持），
#     所以「80 端口开 http2」没有用，要在 443 上开。
#   * nginx 1.22（Debian 12 自带）写 `listen 443 ssl http2;`；
#     nginx ≥ 1.25.1 改成 `listen 443 ssl;` + `http2 on;`。
#   * 证书两条路：
#       ① 阿里云免费证书（推荐，国内签发快）：控制台申请 → 下载「nginx 格式」→
#          上传到 /etc/nginx/ssl/（如 vcp.example.edu.cn.crt / .key）
#       ② certbot：sudo apt-get install -y certbot python3-certbot-nginx
#                  sudo certbot --nginx -d 你的域名      # 自动改配置并自动续期
#                  前提：域名已解析到本机、安全组放通 80/443
#   * 上 TLS 后建议把上面 80 的 server 改成 301 跳转：
#       listen 80; server_name 你的域名; return 301 https://$host$request_uri;
#   * 【容易漏】nginx 不会把 location /、location /api/ 自动继承到新 server 块，
#     整段复制过去（或把公共部分抽到 includes/ 下的文件里再用 include 引入）。
#
# server {
#     listen      443 ssl;
#     listen      [::]:443 ssl;
#     http2 on;                                  # nginx < 1.25.1 请改用 listen 443 ssl http2;
#     server_name vcp.example.edu.cn;            # 【必改】实际域名
#
#     ssl_certificate     /etc/nginx/ssl/vcp.example.edu.cn.crt;   # 【必改】
#     ssl_certificate_key /etc/nginx/ssl/vcp.example.edu.cn.key;   # 【必改】
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     root  /var/www/vcp;
#     index index.html;
#     charset utf-8;
#     client_max_body_size 6m;
#
#     # ↓↓↓ 把上面 80 端口 server 块里的这些整段复制进来 ↓↓↓
#     #   server_tokens off;
#     #   gzip / gzip_static / gzip_types 一组
#     #   location /            { try_files $uri $uri/ /index.html; }
#     #   location = /index.html
#     #   location ~* \.(js|css|...)$
#     #   location = /nginx-health
#     #   location /api/        { ... }
# }
# ============================================================================
