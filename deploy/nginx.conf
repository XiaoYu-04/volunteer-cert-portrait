# =============================================================
# 高校志愿服务时长认证与公益画像数据分析系统 —— Nginx 站点配置
#
# 放在 /etc/nginx/conf.d/vcp.conf（或 sites-available/ 下再软链）。
# 对应的部署步骤与验收清单见 docs/部署文档.md。
#
# 架构：浏览器 → Nginx（80/443）
#                    ├─ /       → 静态文件（volunteer-cert-portrait-web 的 dist/）
#                    └─ /api/   → 反代 http://127.0.0.1:8080（后端无 context-path）
#
# ⚠️ 本文件**只做人工核对，未经过 nginx -t 语法校验** —— 编写它的机器上没装 nginx。
#    首次部署时请先 `nginx -t` 再 reload。
# =============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  vcp.example.edu.cn;      # 【部署前必改】改成实际域名或 IP

    root  /var/www/vcp;
    index index.html;

    charset utf-8;

    # 上传功能（待办 C9）未实现，请求体都是小 JSON，1m 足够；
    # 将来做文件上传时要同步调大，否则会 413。
    client_max_body_size 1m;

    # ---------- 压缩 ----------
    # 前端主 chunk 56.7 kB / gzip 21.5 kB、request chunk 113.0 kB / gzip 42.9 kB，
    # 压缩收益明显。ECharts 那个 652.8 kB 的懒加载 chunk 收益最大。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # ---------- 前端静态资源 ----------
    location / {
        # ⚠️ 这一行是 SPA 的命门：前端用的是 history 路由（/student/profile、
        #    /admin/categories…），这些路径在磁盘上并不存在。没有这行回退，
        #    用户一刷新深层页面就是 404 —— 部署验收清单里专门列了这一条。
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须**不缓存**：它是唯一引用带 hash 文件名 chunk 的文件，
    # 一旦被浏览器缓存，发版后用户会拿旧 index.html 去请求已经删掉的旧 chunk，页面白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 带内容 hash 的产物可以长缓存 —— 内容变了文件名就变，不存在缓存失效问题。
    # （Vite 产物固定放 dist/assets/ 下，文件名形如 index-B6A-K1q_.js）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        # 注意结尾**没有**斜杠：proxy_pass 不带 URI 时原样透传路径，
        # 于是 /api/v1/auth/login 到达后端仍是 /api/v1/auth/login。
        # 后端未配 server.servlet.context-path，接口前缀就是 /api/v1/，
        # 与前端 .env 的 VITE_API_BASE_URL=/api 对得上。
        # 若在这里写成 proxy_pass http://127.0.0.1:8080/;（带斜杠），
        # 路径会被剥掉 /api 前缀，后端一律 404。
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 登录态走 Authorization: Bearer <token>（Sa-Token 配了 is-read-header: true），
        # 请求头默认就会透传，无需额外配置；这里写出来是为了防止后人误加 proxy_set_header 覆盖。
        proxy_set_header Authorization $http_authorization;

        # 后端 Knife4j 文档页在 prod profile 下也走同一端口，超时给宽一点
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 收口 ----------
    # ⚠️ 后端 application.yml **没有配 server.address**，默认监听 0.0.0.0:8080，
    #    也就是说 8080 是直接暴露在网上的。两件事必须做一件：
    #      ① 在启动参数或 config/application-local.yml 里加 server.address=127.0.0.1
    #         （推荐，见 docs/部署文档.md 第 4 步），或
    #      ② 用防火墙/安全组挡掉 8080 的外部访问。
    #    否则别人可以绕过 Nginx 直接打后端，且 Knife4j 文档页会跟着一起暴露
    #    （prod profile 下文档页要登录态，但接口本身仍可被直接调用）。
    #
    # 若要额外挡 actuator（当前未启用 actuator，属预防性配置）：
    # location /actuator/ { deny all; }

    # 隐藏 nginx 版本号
    server_tokens off;
}

# =============================================================
# HTTPS（可选）
#
# 答辩演示若只在校园网内网访问，80 端口够用；对外则建议上 TLS：
#   1) certbot --nginx -d vcp.example.edu.cn   （自动改本文件并加 443 server 块）
#   2) 或手工加 listen 443 ssl; + ssl_certificate / ssl_certificate_key;
# 上 TLS 后记得把 application-prod.yml 的 vcp.cors.allowed-origin-patterns
# 改成 https:// 开头的实际域名（同源反代下该项其实不会命中，但改了更严谨）。
# =============================================================