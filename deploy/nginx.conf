# =============================================================
# 高校志愿服务时长认证与公益画像数据分析系统 —— Nginx 站点配置
#
# 放在 /etc/nginx/conf.d/vcp.conf（或 sites-available/ 下再软链）。
# 对应的部署步骤与验收清单见 docs/部署文档.md。
#
# 架构：浏览器 → Nginx（80/443）
#                    ├─ /       → 静态文件（volunteer-cert-portrait-web 的 dist/）
#                    └─ /api/   → 反代 http://127.0.0.1:8080（后端无 context-path）
#
# ⚠️ 本文件**只做人工核对，未经过 nginx -t 语法校验** —— 编写它的机器上没装 nginx。
#    首次部署时请先 `nginx -t` 再 reload。
#    2026-09-25 补充：本文件里与「静态托管 / history 回退 / /api 反代」有关的语义，
#    已用一个**本机 Node 替身**按同样规则实跑验证过（见 docs/部署文档.md 第九节），
#    但 nginx 自身的语法与模块行为仍**未实测**，别把替身的结论当成 nginx 的结论。
#    2026-09-27 变更：活动图片存数据库（attachment.file_data，BYTEA + sha256），
#    经 /api/v1/attachments/{id}/content 输出（命中下面的 /api/ 反代，无需静态目录）；
#    /uploads alias 已删除，2026-09-25 记录里「/uploads alias 已实测」的说法就此过时，以本行为准。
# =============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  vcp.example.edu.cn;      # 【部署前必改】改成实际域名或 IP

    root  /var/www/vcp;
    index index.html;

    charset utf-8;

    # 活动图片单张上限 5MB，multipart 请求额外留出表单开销。
    client_max_body_size 6m;

    # ---------- 压缩 ----------
    # 2026-09-25 实测（VITE_USE_MOCK=false 的正式部署口径，vite 8.3.0 构建）：
    #   入口 chunk index-*.js            22.93 kB / gzip   7.87 kB
    #   入口一并 preload 的 9 个 chunk    42.73 kB / gzip  18.44 kB   ← 首屏 JS 合计 65.66 kB / gzip 26.31 kB
    #   request-*.js                    113.14 kB / gzip  42.91 kB   ← 在 index.html 的 modulepreload 列表里
    #   index-*.css                     28.68 kB / gzip   6.17 kB
    #   echarts-*.js                    652.78 kB / gzip 219.43 kB   ← **懒加载**，不在 preload 里，收益最大
    # 压缩收益明显。注：主 chunk 的体积随 rolldown 的自动分包变化，
    # 「首屏 JS 合计」比单个 index-*.js 更能代表首次加载量（口径详见 docs/部署文档.md 第 5.1 节）。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # ---------- 前端静态资源 ----------
    location / {
        # ⚠️ 这一行是 SPA 的命门：前端用的是 history 路由（/student/profile、
        #    /admin/categories…），这些路径在磁盘上并不存在。没有这行回退，
        #    用户一刷新深层页面就是 404 —— 部署验收清单里专门列了这一条。
        #
        # 语义提醒（2026-09-25 实测确认）：最后一个参数是 URI，nginx 会做**内部重定向**并
        # 重新匹配 location，所以回退出来的 index.html 会命中下面 `location = /index.html`，
        # 于是 `/`、深层路由、`/index.html` 三种请求**都**带 no-cache 头。
        try_files $uri $uri/ /index.html;
    }

    # index.html 必须**不缓存**：它是唯一引用带 hash 文件名 chunk 的文件，
    # 一旦被浏览器缓存，发版后用户会拿旧 index.html 去请求已经删掉的旧 chunk，页面白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 带内容 hash 的产物可以长缓存 —— 内容变了文件名就变，不存在缓存失效问题。
    # （Vite 产物固定放 dist/assets/ 下，文件名形如 index-B6A-K1q_.js）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 活动图片（2026-09-27 变更）：二进制存数据库（attachment.file_data），
    # 经 /api/v1/attachments/{id}/content 输出，命中下面的 /api/ 反代；
    # 本文件不再有 /uploads 静态映射，服务器上也无需准备上传目录。

    location = /favicon.ico { access_log off; log_not_found off; }

    # ---------- 后端 API 反代 ----------
    location /api/ {
        # 注意结尾**没有**斜杠：proxy_pass 不带 URI 时原样透传路径，
        # 于是 /api/v1/auth/login 到达后端仍是 /api/v1/auth/login。
        # 后端未配 server.servlet.context-path，接口前缀就是 /api/v1/，
        # 与前端 .env 的 VITE_API_BASE_URL=/api 对得上。
        # 若在这里写成 proxy_pass http://127.0.0.1:8080/;（带斜杠），
        # 路径会被剥掉 /api 前缀，后端一律 404。
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 登录态走 Authorization: Bearer <token>（Sa-Token 配了 is-read-header: true），
        # 请求头默认就会透传，无需额外配置；这里写出来是为了防止后人误加 proxy_set_header 覆盖。
        proxy_set_header Authorization $http_authorization;

        # ⚠️ 本块只反代 /api/。**文档页不经 Nginx**：`/doc.html`、`/v3/api-docs` 不在 /api/ 下，
        #    会落到上面的 `location /` 被 try_files 回退成 index.html（2026-09-25 本机替身实测：
        #    `GET /doc.html` → 200 + 前端 index.html，不是 Knife4j 页面）。
        #    这是**有意的**：prod profile 下文档页要求登录态，而浏览器打开文档页时不会带
        #    Authorization 头（Sa-Token 配的是 is-read-header: true、is-read-cookie: false），
        #    就算反代过去也只会看到 401 JSON，没有可用性，反而多一处暴露面。
        #    要核「prod 收口是否生效」，请在服务器上直连后端：
        #      curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/doc.html   # 期望 401
        #    确实想通过域名访问文档页时，再加下面这段（并自行评估暴露面）：
        #      location ~ ^/(doc\.html|webjars/|v3/api-docs|knife4j/) {
        #          proxy_pass http://127.0.0.1:8080;
        #          proxy_set_header Host $host;
        #      }
        #
        # 后端 Knife4j 文档页与接口同端口（8080），反代超时给宽一点
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ---------- 收口 ----------
    # ⚠️ 后端 application.yml **没有配 server.address**，只写 server.port: 8080（application.yml:1-2），
    #    也就是说**裸起 jar 时**监听 0.0.0.0:8080，8080 直接暴露在网上。两件事必须做一件：
    #      ① 启动参数加 --server.address=127.0.0.1（推荐，见 docs/部署文档.md 第 4.4 节）——
    #         **deploy/vcp.service 的 ExecStart 里已经加了这一段**，用 systemd 起就已经是这个收口状态；或
    #      ② 用防火墙/安全组挡掉 8080 的外部访问。
    #    否则别人可以绕过 Nginx 直接打后端（prod profile 下文档页要登录态，但接口本身仍可被直接调用）。
    #    验收方式：从外网 curl http://<域名>:8080/api/v1/categories 应当**连不上**
    #    （deploy/verify-deploy.ps1 的 -PublicBackendUrl 参数就是干这个的）。
    #
    # 若要额外挡 actuator（当前未启用 actuator，属预防性配置）：
    # location /actuator/ { deny all; }

    # 隐藏 nginx 版本号
    server_tokens off;
}

# =============================================================
# HTTPS（可选）
#
# 答辩演示若只在校园网内网访问，80 端口够用；对外则建议上 TLS：
#   1) certbot --nginx -d vcp.example.edu.cn   （自动改本文件并加 443 server 块）
#   2) 或手工加 listen 443 ssl; + ssl_certificate / ssl_certificate_key;
# 上 TLS 后记得把 application-prod.yml 的 vcp.cors.allowed-origin-patterns
# 改成 https:// 开头的实际域名（同源反代下该项其实不会命中，但改了更严谨）。
# =============================================================
