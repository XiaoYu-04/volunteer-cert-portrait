server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: volunteer-cert-portrait
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # 【凭证一律外置，不得写回本文件】仓库是公开仓库，明文口令进过 git 历史，删掉文件也删不掉历史。
  # 读取优先级：环境变量 → application-local.yml（已在 .gitignore 中）。
  # 三条 import 按序尝试，文件不存在不报错（optional:）；模板见同目录 application-local.yml.example。
  config:
    import:
      # 前三条是本地开发的候选位置（文件不存在不报错）；最后一条是部署用。
      - optional:classpath:application-local.yml        # IDE 内运行：放 vcp-boot/src/main/resources/
      - optional:file:./vcp-boot/src/main/resources/application-local.yml   # 在 volunteer-cert-portrait-server/ 下 java -jar 时，读源码树里那份（该文件已被 pom 排除、不会进 jar）
      - optional:file:./application-local.yml           # 启动目录下（java -jar 与源码根目录运行）
      - optional:file:./config/application-local.yml    # 部署时放 jar 同级的 config/ 下
  datasource:
    driver-class-name: org.postgresql.Driver
    # 库名 volunteer_cert_portrait 取自知识库《命名体系总表》
    # sslmode=prefer：优先 SSL，服务端不支持时自动回退，兼容强制/非强制 SSL 两种云实例
    url: jdbc:postgresql://103.40.14.100:19476/volunteer_cert_portrait?currentSchema=public&stringtype=unspecified&sslmode=prefer
    # 【演示口径，2026-09-26 决定】口令**明文**写在这里：123456。
    # 云库是共享演示库、库里全是演示数据；目标是任何人 clone 下来**零配置**即可连库。
    # 代价（知情选择）：仓库是 public，等于把口令公开 —— 任何能访问 103.40.14.100:19476 的人
    # 都能改/删这个库里的数据。因此这个库**只允许放演示数据**。
    # ⚠️ 答辩结束后必须轮换口令；生产部署必须用 --spring.profiles.active=prod + 环境变量覆盖。
    # 历史背景：口令曾泄露进 git 历史并轮换过一次，本次是**刻意**改回明文，属演示取舍，不是疏忽。
    # 覆盖方式（优先级从高到低）：环境变量（VCP_DB_USERNAME / VCP_DB_PASSWORD）→ application-local.yml 里覆盖
    # spring.datasource.username / password（模板见同目录 application-local.yml.example）。
    username: ${VCP_DB_USERNAME:postgres}
    password: ${VCP_DB_PASSWORD:123456}
    # 另注：2026-09-24 起 vcp-boot/pom.xml 的 <resources> 已把 application-local.yml 排除出打包，
    # jar 里不再有它（clean 重打后实测确认，见 docs/下一步待办.md 第 12 项）；
    # 本地开发按上面 spring.config.import 的 file 路径读取，部署时用 jar 同级 config/application-local.yml 或环境变量。
    hikari:
      pool-name: VcpHikariPool
      # 云数据库的并发连接配额通常远小于本地实例，池子刻意调小
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  # 数据库迁移：脚本统一放 classpath:db/migration，命名与使用约定见 V1__init_baseline.sql 头部注释
  flyway:
    # 【当前阶段刻意关闭】建表脚本以仓库根目录 sql/ 下的脚本为准（手工执行），避免同一份 DDL 维护两遍而漂移。
    # Flyway 的已执行脚本受 checksum 保护、不可再改，而表结构在开发期会频繁变动，此时开启只会处处报错。
    # 【何时开启】表结构稳定后：把 sql/02_schema.sql、sql/03_init_data.sql 原样复制到
    #            vcp-boot/src/main/resources/db/migration/ 下并改名为 V2__init_schema.sql、V3__init_data.sql，
    #            然后把这里改回 true，应用启动时会自动建表并写入初始化数据。
    enabled: false
    # 迁移脚本目录，显式写出，后续如需按环境追加位置在此扩展
    locations: classpath:db/migration
    # 脚本编码，与工程源码保持一致
    encoding: UTF-8
    # 对非空 schema 自动打基线：若库里已存在手工建的表/数据，没有该开关 Flyway 会直接报
    # "Found non-empty schema(s) ... but no schema history table" 并拒绝启动；空库场景下无副作用
    baseline-on-migrate: true
    # 基线版本号取 0，保证打过基线的库上 V1 及之后的脚本仍会被执行
    baseline-version: '0'
    # 历史表单独命名，避免与业务表命名风格冲突
    table: flyway_schema_history
    # 启动时校验已执行脚本的 checksum，防止已执行脚本被事后修改
    validate-on-migrate: true
    # 迁移目录不存在时直接失败，避免路径写错却静默跳过迁移
    fail-on-missing-locations: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  # 各业务模块的 mapper xml 统一放 src/main/resources/mapper/ 下
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 必须与建表脚本一致：DDL 用的是 BIGSERIAL（数据库自增），
      # 若配成 MyBatis-Plus 默认的 assign_id（雪花 ID），则由应用生成主键、绕过序列，
      # 会与脚本里显式写入的初始数据（id=1,2,3…）以及 setval 修复逻辑冲突
      id-type: auto
      # 逻辑删除约定：实体含 deleted 字段即自动生效（1=已删除，0=未删除）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端在 Authorization 请求头中携带，值形如 "Bearer xxx"
  token-name: Authorization
  token-prefix: Bearer
  # 30 天有效期，-1 表示不限制活跃超时
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  # 仅从请求头读取，不写 Cookie，避免前后端分离场景下的 CSRF 问题
  is-read-header: true
  is-read-cookie: false
  is-log: false

# 接口文档 Knife4j Next：/doc.html 是文档页，/v3/api-docs 是 OpenAPI JSON
knife4j:
  # 必开项：该属性默认 false 且没有 matchIfMissing，不开则增强能力（接口过滤、调试、/knife4j/config）
  # 全部静默失效 —— 但 /doc.html 仍能打开，极易误判为已接好
  # 该开关同时决定 SaTokenConfig 是否放行文档路径（见 SaTokenConfig.DOC_EXCLUDE_PATHS）：
  # true 时四个文档路径照旧免登录；application-prod.yml 设为 false，文档页与 /v3/api-docs 随之要求登录态。
  enable: true

# 跨域允许的来源模式：逗号分隔可填多个，如 https://a.example.edu.cn,https://b.example.edu.cn
# 开发期保持 *（与 WebMvcConfig 改动前的硬编码取值一致）；正式部署由 application-prod.yml 收紧为实际前端域名。
# 读取方见 WebMvcConfig：本项缺失时同样回退为 *。
vcp:
  cors:
    allowed-origin-patterns: "*"
  upload:
    # 文件本体放这里；jar 从 volunteer-cert-portrait-server/ 启动时即该目录下 uploads/
    dir: ./uploads
    # 数据库存 /uploads/...，开发期由后端静态资源映射，生产可由 Nginx alias
    public-prefix: /uploads

logging:
  level:
    root: info
    # debug 级别下 MyBatis 会输出执行的 SQL
    # 开发期保持 debug；application-prod.yml 已设为 info，生产不再全量打印 SQL
    com.vcp: debug
